# One-click deploy on Render (https://render.com)
# New Web Service → Connect repo → Render reads this file.
services:
  - type: web
    name: mejor-express
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MOONSHOT_BASE_URL
        value: "https://api.moonshot.cn/v1"
      - key: MOONSHOT_MODEL
        value: "kimi-k2.6"
      - key: MOONSHOT_API_KEY
        sync: false
